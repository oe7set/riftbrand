name: Deploy

# main -> site root, every other branch -> /dev/<branch-slug>/ (TECH_DESIGN §15).
# GitHub Pages must be set to "Deploy from a branch: gh-pages / (root)".
on:
  push:
    branches-ignore: [gh-pages]
  delete:

permissions:
  contents: write

# Serialize all writes to gh-pages so concurrent deploys never clobber each other.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve target
        id: target
        env:
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "base=/$REPO/" >> "$GITHUB_OUTPUT"
            echo "pwa=true" >> "$GITHUB_OUTPUT"
          else
            slug=$(scripts/branch-slug.sh "$BRANCH")
            echo "dir=dev/$slug" >> "$GITHUB_OUTPUT"
            echo "base=/$REPO/dev/$slug/" >> "$GITHUB_OUTPUT"
            echo "pwa=false" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: ${{ steps.target.outputs.base }}
          ENABLE_PWA: ${{ steps.target.outputs.pwa }}
          GIT_SHA: ${{ github.sha }}
      - name: Publish to gh-pages
        run: scripts/publish-pages.sh publish "${{ steps.target.outputs.dir }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        env:
          OWNER: ${{ github.repository_owner }}
          BASE: ${{ steps.target.outputs.base }}
        run: echo "Deployed to https://${OWNER,,}.github.io${BASE}" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Remove branch preview
        env:
          BRANCH: ${{ github.event.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish-pages.sh remove "dev/$(scripts/branch-slug.sh "$BRANCH")"
